name: 🌟 Auto GitHub Star Analyzer

on:
  schedule:
    # Executa a cada hora automaticamente (Zero esforço manual)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite disparar manualmente com um clique

permissions:
  contents: write

jobs:
  track-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Rastrear Novos Favoritos & Gerar Análise com IA
        env:
          TARGET_USERNAME: "Jerixco"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/star_tracker.py

      - name: 🚀 Salvar e Publicar Atualizações no Catálogo
        run: |
          git config --global user.name "GitHub Star Bot"
          git config --global user.email "bot@github-actions.local"
          git add CATALOGO_ESTRELAS.md data/
          if git diff --staged --quiet; then
            echo "Nenhum novo favorito detectado nesta execução."
          else
            git commit -m "chore(stars): atualiza catálogo com novos repositórios analisados por IA [skip ci]"
            git push
          fi
